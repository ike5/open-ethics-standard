name: Validate standard and MCP

on:
  pull_request:
    paths:
      - "OPEN-ETHICS-STANDARD.md"
      - "scripts/**"
      - "packages/oes-mcp/**"
      - "package.json"
      - ".github/workflows/validate-standard.yml"

permissions:
  contents: read

jobs:
  build:
    # The npm package runs wherever users' AI clients do, so test it on each OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix packages/oes-mcp
      - run: npm test
