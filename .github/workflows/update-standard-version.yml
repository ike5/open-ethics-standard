name: Update standard version and date

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: update-standard-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  update-standard:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check whether the PR changed the standard
        id: changes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files.some((file) => file.filename === "OPEN-ETHICS-STANDARD.md");
            core.setOutput("changed", String(changed));
            if (!changed) return;
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const bump = ["major", "minor", "patch"].find((level) => labels.includes(`version:${level}`)) || "patch";
            core.setOutput("bump", bump);
      - name: Bump version and update date
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/release-standard.mjs "${{ steps.changes.outputs.bump }}"
      - name: Generate the updated catalog and build the MCP
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/build-catalog.mjs
          npm install --prefix packages/oes-mcp
          npm run build:mcp
      - name: Bump the npm package so npx @latest users get the new catalog
        if: steps.changes.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version --prefix packages/oes-mcp
      - name: Commit metadata update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPEN-ETHICS-STANDARD.md packages/oes-mcp/catalog.json packages/oes-mcp/package.json packages/oes-mcp/package-lock.json
          git commit -m "chore: update standard version and date"
          git push origin main
      - name: Publish the npm package
        if: steps.changes.outputs.changed == 'true'
        # Pushes made with GITHUB_TOKEN don't trigger workflows, but workflow_dispatch does.
        run: gh workflow run publish-npm.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
