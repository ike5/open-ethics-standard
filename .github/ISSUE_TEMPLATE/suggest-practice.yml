name: Suggest a practice
description: Propose a new practice, a correction, or a removal.
labels: ["standard"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type of change
      options: [New practice, Correction or clarification, Removal]
    validations:
      required: true
  - type: input
    id: practice
    attributes:
      label: Related practice ID
      description: For example, 2.1.3. Leave blank for a new practice.
  - type: dropdown
    id: principle
    attributes:
      label: Which principle does it break?
      description: Pick the closest one. See Part I of the standard.
      multiple: true
      options: [Honesty, Autonomy, Privacy, Fairness, Care, Safety, Accountability, Responsibility]
  - type: textarea
    id: harmed
    attributes:
      label: Who is harmed?
      description: Customers, workers, suppliers, communities, the environment, or others.
  - type: textarea
    id: details
    attributes:
      label: What should change, and why?
      description: Describe the practice in plain language, with a real-world example if you can.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Links to reporting, research, or regulation (optional).
