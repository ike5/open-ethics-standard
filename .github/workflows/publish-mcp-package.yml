name: Publish OES MCP package

on:
  push:
    tags: ["oes-mcp-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        working-directory: packages/oes-mcp
      - run: npm run build
        working-directory: packages/oes-mcp
      - run: npm publish
        working-directory: packages/oes-mcp
