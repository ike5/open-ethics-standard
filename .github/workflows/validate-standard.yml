name: Validate standard and MCP

on:
  pull_request:
    paths:
      - "OPEN-ETHICS-STANDARD.md"
      - "scripts/**"
      - "packages/oes-mcp/**"
      - "package.json"
      - "docs/oes-report.mjs"
      - ".github/workflows/validate-standard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/oes-mcp
      - run: npm test
      - name: Check docs/oes-report.mjs is up to date
        run: git diff --exit-code docs/oes-report.mjs
